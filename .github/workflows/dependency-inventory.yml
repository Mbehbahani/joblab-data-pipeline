name: Dependency Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/requirements*.txt"
      - ".github/workflows/dependency-inventory.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: dependency-inventory
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate dependency inventory
        shell: python
        run: |
          from pathlib import Path

          requirement_files = sorted(
              path for path in Path(".").rglob("requirements*.txt")
              if ".git" not in path.parts
          )
          sections = []
          for path in requirement_files:
              declarations = [
                  line.rstrip()
                  for line in path.read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]
              body = "\n".join(declarations) or "(No dependency declarations)"
              sections.append(f"## `{path.as_posix()}`\n\n```text\n{body}\n```")

          output = (
              "# Dependency Inventory\n\n"
              "> Automatically maintained by GitHub Actions from the repository's "
              "requirements files.\n\n"
              + ("\n\n".join(sections) if sections else "No requirements files found.")
              + "\n"
          )
          destination = Path("docs/dependency-inventory.md")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(output, encoding="utf-8", newline="\n")

      - name: Commit inventory changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- docs/dependency-inventory.md)" ]; then
            echo "Dependency inventory is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dependency-inventory.md
          git commit -m "docs: update dependency inventory"
          git push
