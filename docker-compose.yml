services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: joblab-postgres
    environment:
      POSTGRES_DB: joblab
      POSTGRES_USER: joblab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGREST_DB_PASSWORD: ${POSTGREST_DB_PASSWORD:?Set POSTGREST_DB_PASSWORD in .env}
    volumes:
      - ${JOBLAB_POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblab -d joblab"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgrest:
    image: postgrest/postgrest:v12.2.12
    environment:
      PGRST_DB_URI: postgres://joblab_authenticator:${POSTGREST_DB_PASSWORD:?Set POSTGREST_DB_PASSWORD in .env}@postgres:5432/joblab
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: joblab_readonly
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET:?Set POSTGREST_JWT_SECRET in .env}
      PGRST_SERVER_PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./deployment/nginx/postgrest.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgrest
    restart: unless-stopped

networks:
  default:
    name: joblab